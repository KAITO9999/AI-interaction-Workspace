name: AgentKit checks

on:
  push:
    branches: [main, "migration/**", "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  agentkit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m py_compile TOOLS/AgentKit/agentkit.py TOOLS/AgentKit/agentkit_ext.py TOOLS/AgentKit/agentkit_resolve.py TOOLS/AgentKit/agentkit_code_audit.py TOOLS/AgentKit/agentkit_zipset.py TOOLS/AgentKit/agentkit_toolplan.py TOOLS/AgentKit/agentkit_testfast.py TOOLS/AgentKit/agentkit_js_load.py scripts/check_change_ledger.py
      - name: Check POSIX shell syntax
        run: sh -n TOOLS/AgentKit/agentkit TOOLS/AgentKit/agentkit.sh
      - name: Run AgentKit tests
        run: python -m unittest discover -s TOOLS/AgentKit/tests -v
      - name: Validate pull-request change provenance
        run: python scripts/check_change_ledger.py
      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
